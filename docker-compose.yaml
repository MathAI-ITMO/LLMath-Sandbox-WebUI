version: '3.8'
services:
  backend:
    image: ghcr.io/mathai-itmo/llmath-backend:latest
    ports:
      - 8002:5000
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=math-llm-backend;Username=postgres;Password=postgres
      OpenAi__ChatModel__Token: ollama
      OpenAi__ChatModel__Url: http://host.docker.internal:11434/v1
      OpenAi__ChatModel__Model: gemma3:4b
      OpenAi__SolverModel__Token: ollama
      OpenAi__SolverModel__Url: http://host.docker.internal:11434/v1
      OpenAi__SolverModel__Model: gemma3:4b
      GeolinClientOptions__BaseAddress: http://geolin:8080
      ProblemsClientOptions__BaseAddress: http://problems:8000
      CorsConfiguration__Enabled: False
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      problems:
        condition: service_started
      geolin:
        condition: service_started

  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: math-llm-backend
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]
  mongo:
    image: mongo:latest
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongoadmin
    ports:
      - 27017:27017
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  problems:
    image: ghcr.io/mathai-itmo/llmath-problems:latest
    restart: always
    environment:
      - CONNECTION_STRING=mongodb://mongoadmin:mongoadmin@mongo:27017/?authSource=admin
    ports:
      - 8000:8000
    depends_on:
      mongo:
        condition: service_healthy

  geolin:
    image: ghcr.io/mathdepitmo/geolin-milestones:latest
    restart: always
    ports:
      - 8001:8080

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: always
    ports:
      - 8003:8000
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/ || curl -f http://localhost:8000/v1/models || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  speaches-init:
    image: curlimages/curl:latest
    depends_on:
      speaches:
        condition: service_started
    command: >
      sh -c "
      echo 'Waiting for speaches service to be ready...' &&
      until curl -f http://speaches:8000/ > /dev/null 2>&1; do
        echo 'Service not ready yet, waiting...' &&
        sleep 5
      done &&
      echo 'Service is ready, running initialization curl...' &&
      curl 'http://speaches:8000/v1/models/guillaumekln/faster-whisper-tiny' -X POST &&
      echo 'Initialization complete'
      "
    restart: "no"

  video:
    image: ghcr.io/mathai-itmo/llmath-video:latest
    restart: always
    env_file:
      - .env
    environment:

      VIDEOAPP_OPENAI_API_KEY: ollama
      VIDEOAPP_OPENAI_API_BASE: http://host.docker.internal:11434/v1
      VIDEOAPP_OPENAI_MODEL: gemma3:4b

      VIDEOAPP_OPENAI_STT_API_BASE: http://speaches:8000/v1
      VIDEOAPP_OPENAI_STT_API_KEY: dummy
      VIDEOAPP_OPENAI_STT_MODEL: guillaumekln/faster-whisper-tiny
      VIDEOAPP_WHISPER_LANGUAGE: ru

      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 5001
      VIDEOAPP_DISABLE_CORS: False
    ports:
      - 5001:5001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      speaches:
        condition: service_started

